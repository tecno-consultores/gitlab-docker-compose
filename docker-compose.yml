services:
  gitlab:
    image: 'gitlab/gitlab-ce:latest'
    pull_policy: always
    restart: always
    hostname: 'git.example.com'
    container_name: gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://git.example.com'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
    ports:
      - '8080:80'
      - '4443:443'
      - '2224:22'
    volumes:
      - './config:/etc/gitlab'
      - './logs:/var/log/gitlab'
      - './data:/var/opt/gitlab'
    shm_size: '256m'

